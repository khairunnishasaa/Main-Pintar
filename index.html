<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Main Pintar</title>
<meta name="theme-color" content="#bfe3ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2d63;--cream:#fff8e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(#bfe3ff,#eadcff 60%,#9fe3a0) fixed;padding:14px 12px 40px}
.w{max-width:520px;margin:0 auto}
.scr{display:none}.scr.on{display:block}
h1{margin:0;font-size:1.9rem;font-weight:800;text-align:center}
h2{margin:0 0 10px;font-size:1.15rem}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:16px;margin-top:16px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid #7a4dff;outline-offset:2px}
.ages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.age{background:var(--c);border:3px solid var(--ink);border-radius:20px;padding:8px 0;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1}
.age b{font-size:2.4rem;font-weight:800}.age span{font-size:.85rem;font-weight:800}
.age.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);outline:4px solid #fff}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ty{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;font-weight:800;font-size:1rem;text-align:left}
.ty i{font-style:normal;font-size:1.6rem}.ty.on{background:#ffe38a}
.lvs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.lv b{font-size:1.4rem}.lv small{font-size:.8rem;color:#e6a100}.lv.on{background:#b5efcb}
.go{display:block;width:100%;margin-top:16px;background:#ffc933;border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);font-size:1.8rem;font-weight:800;padding:8px}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.go.alt{background:#fff;font-size:1.2rem}
#last{font-weight:800;font-size:1.05rem}
.hello{text-align:center;margin-top:12vh;padding:28px 18px 22px}
.hello p{font-size:1.3rem;font-weight:800;margin:6px 0 0}
.hero{font-size:6rem;line-height:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.car{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.arr{width:52px;height:52px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:1.2rem;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.arr:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hero{min-width:8rem;touch-action:pan-y;user-select:none}
.cname{font-size:1.9rem;font-weight:800;margin-top:4px}
.dots{display:flex;gap:7px;justify-content:center;margin:6px 0 2px}
.dots i{width:12px;height:12px;border-radius:50%;background:#e4dcf5;border:2px solid var(--ink)}.dots i.on{background:#ffc933}
.pink{display:inline-block;filter:sepia(.5) saturate(3.5) hue-rotate(295deg)}
.mascot{display:inline-block}.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-18px) scale(1.15)}}
.th0::after,.th1::after,.th2::after,.th3::after,.th4::after{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:2.2rem;letter-spacing:10px;z-index:-1;pointer-events:none}
.th0{background:linear-gradient(#bfe3ff,#eadcff 60%,#9fe3a0) fixed}.th0::after{content:"☁️ ☁️ 🌈 ☁️"}
.th1{background:linear-gradient(#cdeeff,#fff4c2 55%,#8fdc7a) fixed}.th1::after{content:"🌷 🌼 🦋 🌻 🌷"}
.th2{background:linear-gradient(#aee8ff,#4fb6e8 55%,#1f7fc4) fixed}.th2::after{content:"🐠 🌊 🐙 🌊 🐬"}
.th3{background:linear-gradient(#2b2a6e,#5a3f9a 60%,#a05fc4) fixed}.th3::after{content:"⭐ 🚀 ✨ 🌙 ⭐"}
.th4{background:linear-gradient(#ffd1e8,#ffe9b8 55%,#c9f0d6) fixed}.th4::after{content:"🍭 🍬 🍩 🍬 🍭"}
.card{position:relative}
.cr{display:table;margin:26px auto 0;background:rgba(255,248,230,.85);border-radius:99px;padding:2px 14px;font-size:.8rem;font-weight:500}
.help{display:block;margin:14px auto 0;background:#fff0b8;border:3px solid #d9a21b;border-radius:99px;padding:6px 24px;font-weight:800;font-size:1.1rem}
#say{line-height:1.2}
.g{display:inline-block;font-size:1.4rem;line-height:1.2;word-break:break-all}
.eqn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:1.9rem}
.tp{position:relative;display:inline-block;cursor:pointer;margin:1px}
.tp sup{position:absolute;right:-4px;top:-6px;font-size:.8rem;font-weight:800;background:#ffc933;border:2px solid var(--ink);border-radius:50%;min-width:1.4em;text-align:center;line-height:1.3}
.tp.cn{animation:hop .4s}
.x{position:relative;opacity:.45}.x::after{content:"❌";position:absolute;left:0;top:0;font-size:.8em}
.fr{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.cl{width:2.4rem;height:2.4rem;background:#fff;border:3px solid #2f3f8f;border-radius:8px;font-size:1.5rem;line-height:1.9rem;text-align:center}
.tray,.bsk{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;border-radius:18px;min-height:76px}
.tray{background:#fff;border:3px dashed var(--ink)}.bsk{background:#ffe9b8;border:3px solid var(--ink);margin-top:10px}
.it{font-size:2rem;background:none;border:0;padding:0;cursor:pointer}
#okb{width:auto;margin:12px auto 0;padding:4px 44px}
.bl{animation:bl .6s infinite alternate}@keyframes bl{to{box-shadow:0 0 0 6px #ffc933;transform:scale(1.04)}}
.pzw{display:flex;gap:10px;justify-content:center;align-items:center}
.pzb{display:grid;gap:3px;background:#d9cfee;padding:3px;border-radius:12px;border:3px solid var(--ink)}
.sl{background:#fffdf5;border-radius:6px;overflow:hidden;display:flex;line-height:0}
.trz{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.pc{touch-action:none;cursor:grab;border:2px solid var(--ink);border-radius:6px;background:#fffdf5;transition:transform .35s}
.pc.sel{outline:4px solid #7a4dff}.pd{border:0;display:block}
.hand{position:absolute;font-size:2.6rem;z-index:8;pointer-events:none;animation:tapp .7s infinite alternate}
@keyframes tapp{to{transform:translateY(-8px) scale(.9)}}
.rest{position:fixed;inset:0;background:rgba(58,45,99,.6);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:16px;overflow-y:auto;overscroll-behavior:contain}.rest[hidden]{display:none}
.rest .card{max-width:420px;width:100%;margin:auto}
.pgb{display:table;margin:0 auto 8px 0;border:3px solid var(--ink);background:#fff;border-radius:99px;padding:4px 18px;font-weight:800;font-size:1.05rem}
.cw{text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink),0 2px 0 var(--ink);font-size:1.3em}
.g{text-align:center}
.trophy{display:inline-block;font-size:5rem;line-height:1.1;transform-origin:50% 100%;animation:tuing 1.4s ease-out both}
.trophy.sm{font-size:2.4rem;vertical-align:middle}.tsm{font-size:2.4rem;vertical-align:middle}
@keyframes tuing{0%{transform:translateY(-70px) scale(.3);opacity:0}25%{transform:translateY(0) scale(1.18,.78);opacity:1}42%{transform:translateY(-42px) scale(.94,1.1)}60%{transform:translateY(0) scale(1.1,.88)}80%{transform:translateY(-10px) scale(.98,1.03)}100%{transform:none}}
.prow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:2.2rem;margin:6px 0}
.ar{font-size:1.2rem}
.sl.bk{width:2.9rem;height:2.9rem;background:#fff;border:3px dashed var(--ink);border-radius:10px;font-size:2rem;line-height:1;justify-content:center;align-items:center}
.sl.bk .pd{font-size:2rem;line-height:1}
.pc.em{font-size:2.3rem;line-height:1;padding:4px 8px;background:#fff;border:3px solid var(--ink);border-radius:12px;user-select:none}
.bd{display:grid;gap:4px;width:min(260px,80vw);margin:0 auto;background:#d9cfee;padding:4px;border-radius:14px;border:3px solid var(--ink)}
.bc{aspect-ratio:1;background:#fffdf5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.arrows{display:flex;gap:8px;justify-content:center;margin-top:10px}
.arw{width:60px;height:60px;font-size:1.8rem;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.arw:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lang{position:fixed;top:10px;left:64px;height:46px;padding:0 14px;border-radius:99px;border:3px solid var(--ink);background:#fff;font-size:1rem;font-weight:800;z-index:5}
.sh{font-weight:800;margin:14px 0 4px;font-size:1.05rem}
.abt{margin-top:16px;font-size:.9rem;line-height:1.35;text-align:left;background:#fff8e6;border-radius:14px;padding:10px 12px}
#sup{display:block;text-decoration:none;text-align:center;margin-top:14px;font-size:1.2rem}
.bgrp{display:flex;gap:10px;justify-content:center;align-items:center;font-size:1.6rem;flex-wrap:wrap}
.gr{opacity:.3;filter:grayscale(1)}
.bnd{position:relative;width:160px;height:126px;margin:8px auto}
.bnd svg{position:absolute;inset:0}
.bnd .cir{position:absolute;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;background:#fff;border:3px solid var(--ink)}
.bnd .c1{left:0;top:0}.bnd .c2{left:0;top:72px}.bnd .c3{left:104px;top:36px;background:#ffe38a}
.bnd .sl.bk.cir{border-style:dashed}
.bnd .pd{font-size:1.7rem;font-weight:800;line-height:1}
.eqr{display:flex;gap:8px;justify-content:center;align-items:center;font-size:1.9rem;font-weight:800;margin-top:6px}
.num.q{min-width:2.9rem;text-align:center}
.pc.em{font-weight:800}
.gear{position:fixed;top:10px;left:10px;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:1.3rem;z-index:5}
.tmr{margin-top:10px;font-size:.9rem;font-weight:500;opacity:.75}
.pgq{font-size:2.2rem;font-weight:800;margin-top:6px}
.ans{font-size:2rem;font-weight:800;min-height:2.8rem;border:3px dashed var(--ink);border-radius:14px;max-width:200px;margin:6px auto;background:#fff}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:10px auto}
.np button{font-size:1.6rem;font-weight:800;padding:6px;border:3px solid var(--ink);border-radius:14px;background:#fff}
.tms{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tms button{width:72px;padding:6px 0;font-size:1.6rem;font-weight:800;border:3px solid var(--ink);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tms button small{font-size:.75rem;font-weight:500}.tms button.on{background:#b5efcb}
.logo{font-size:clamp(2.6rem,11vw,3.4rem);line-height:1.15;white-space:nowrap;letter-spacing:1px}
.logo.sm{font-size:clamp(2rem,8vw,2.4rem)}
.logo span{display:inline-block;color:var(--c);text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink),0 3px 0 var(--ink)}
.logo span:nth-child(odd){transform:rotate(-4deg)}.logo span:nth-child(even){transform:rotate(3deg) translateY(1px)}
[hidden]{display:none !important}
#lgs button{width:auto;min-width:110px;padding:8px 18px;font-size:1.15rem}
#sup{color:var(--ink);text-decoration:none}
.snd{position:fixed;top:10px;right:10px;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:1.4rem;z-index:5}
.top{display:flex;align-items:center;gap:10px}
.back{border:3px solid var(--ink);background:#fff;border-radius:50%;width:44px;height:44px;font-size:1.3rem;font-weight:800}
.track{flex:1;height:16px;background:#eee3c0;border-radius:99px;overflow:hidden;margin-right:48px}
#bar{height:100%;width:0;background:#36c99b;transition:width .3s}
.coach{display:flex;gap:10px;align-items:center;margin-top:12px}
.mascot{font-size:3rem}
#say{flex:1;background:#fff0b8;border-radius:20px;padding:8px 14px;font-weight:800;font-size:1.2rem}
.stim{text-align:center;min-height:5.5rem;font-size:3.6rem;font-weight:800;margin:10px 0;line-height:1.2}
.objs{font-size:2.2rem;line-height:1.3;word-break:break-all}.q{font-style:normal}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:96px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);font-size:clamp(1.5rem,8vw,2.6rem);font-weight:800;padding:6px;overflow-wrap:anywhere;line-height:1.1;display:flex;align-items:center;justify-content:center}
.opt.ok{background:#b5efcb}.opt.no{background:#ffd0d0}
.dot{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;border:3px solid var(--ink)}
.shd{display:inline-block;font-style:normal;filter:brightness(0) opacity(.8)}
.shrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sl.shs{width:5.4rem;height:5.4rem;background:#fff;border:3px dashed var(--ink);border-radius:16px;font-size:4rem;line-height:1;justify-content:center;align-items:center}
.sl.shs.okd{border-style:solid;background:#b5efcb}
.sl.shs .pd{font-size:4rem;line-height:1}
.pc.sg{width:5.4rem;height:5.4rem;display:flex;align-items:center;justify-content:center;font-size:4rem;line-height:1;background:#fff;border:3px solid var(--ink);border-radius:16px;user-select:none}
.half{display:inline-block;width:.5em;height:1em;overflow:hidden;vertical-align:middle;line-height:1}
.half i{display:block;width:1em;font-style:normal}.half.r i{margin-left:-.5em}
#fb{min-height:2.2rem;text-align:center;font-weight:800;font-size:1.3rem;margin-top:12px}
.end{text-align:center}.stars{font-size:4rem;color:#ffb800;letter-spacing:6px}.stars .off{color:#ddd}
.stars span.pop{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.trophy{animation:none}.hand,.bl{animation:none}.hop{animation:none}.hero{animation:none}.stars span.pop{animation:none}#bar{transition:none}}
</style>
</head>
<body>
<button class="snd" id="snd" aria-label="Suara hidup atau mati">🔊</button>
<div class="w">

<section class="scr on" id="welcome">
  <button class="gear" id="gear" aria-label="Pengaturan orang tua">⚙️</button>
  <button class="lang" id="lang" aria-label="Bahasa / Language">🌐 ID</button>
  <div class="card hello">
    <h1 class="logo " aria-label="Main Pintar"><span style="--c:#e8505b">M</span><span style="--c:#ff9f1c">a</span><span style="--c:#2fb872">i</span><span style="--c:#3d8bfd">n</span> <span style="--c:#9b6bff">P</span><span style="--c:#ff6fae">i</span><span style="--c:#e8505b">n</span><span style="--c:#ff9f1c">t</span><span style="--c:#2fb872">a</span><span style="--c:#3d8bfd">r</span></h1>
    <p>Pilih teman bermainmu!</p>
    <div class="car">
      <button class="arr" id="cprev" aria-label="Teman sebelumnya">◀</button>
      <div class="hero" id="hero" role="img" aria-live="polite"></div>
      <button class="arr" id="cnext" aria-label="Teman berikutnya">▶</button>
    </div>
    <div class="cname" id="cname"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="go" id="play">MAIN ▶</button>
    <div class="tmr" id="tmr"></div>
  </div>
</section>

<section class="scr" id="dash">
  <div class="top"><button class="back" id="dback" aria-label="Kembali ke pilih teman">←</button><h1 class="logo sm" style="flex:1;margin-right:54px" aria-label="Main Pintar"><span style="--c:#e8505b">M</span><span style="--c:#ff9f1c">a</span><span style="--c:#2fb872">i</span><span style="--c:#3d8bfd">n</span> <span style="--c:#9b6bff">P</span><span style="--c:#ff6fae">i</span><span style="--c:#e8505b">n</span><span style="--c:#ff9f1c">t</span><span style="--c:#2fb872">a</span><span style="--c:#3d8bfd">r</span></h1></div>
  <div class="card"><h2>1. Pilih usia anak</h2><div class="ages" id="ages"></div></div>
  <div class="card"><h2>2. Pilih permainan</h2><div class="types" id="types"></div></div>
  <div class="card"><h2>3. Pilih level</h2><div class="lvs" id="lv"></div></div>
  <div class="card"><h2>Hasil terakhir</h2><div id="last"></div></div>
  <button class="go" id="start">Mulai ▶</button>
</section>

<section class="scr" id="game">
  <div class="top"><button class="back" id="back" aria-label="Kembali ke halaman utama">🏠</button><div class="track"><div id="bar"></div></div></div>
  <div class="card">
    <div class="coach"><div class="mascot" aria-hidden="true"></div><div id="say"></div></div>
    <div class="stim" id="stim"></div>
    <div class="opts" id="opts"></div>
    <div id="fb" role="status" aria-live="polite"></div>
    <div class="hand" id="hand" hidden aria-hidden="true">👆</div>
    <button class="help" id="help">💡 Bantuan</button>
  </div>
</section>

<section class="scr" id="result">
  <div class="card end">
    <h1>Selesai! 🎉</h1>
    <div class="stars" id="stars"></div>
    <h2 id="score" style="font-size:2rem"></h2>
    <p id="rinfo"></p>
    <button class="go" id="again">Main lagi</button>
    <button class="go alt" id="menu">Kembali ke menu</button>
  </div>
</section>

<footer class="cr">creator: @khairunnishasaa</footer>
</div>
<div class="rest" id="pg" hidden><div class="card end">
  <button class="pgb" id="pgb" hidden></button>
  <div class="hero" id="pgi" aria-hidden="true">😴</div><h1 id="pgt"></h1><p id="pgp"></p>
  <div id="pgq" class="pgq"></div><div id="pga" class="ans"></div><div class="np" id="np"></div>
  <div id="setp" hidden>
    <div class="sh" id="sh1"></div><div class="tms" id="tms"></div>
    <div class="sh" id="sh2"></div><div class="tms" id="lgs"></div>
    <a class="go alt" id="sup" target="_blank" rel="noopener">💝</a>
    <div class="abt" id="abt"></div>
  </div>
  <button class="go alt" id="pgx"></button><div class="cr">creator: @khairunnishasaa</div></div></div>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[R(0,a.length-1)];
const S=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const RG=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
let store={};try{store=JSON.parse(localStorage.getItem('mp1'))||{}}catch(e){}
store.res=store.res||{};
const save=()=>{try{localStorage.setItem('mp1',JSON.stringify(store))}catch(e){}};

/* ===== Suara ===== */
let ac,mute=!!store.mute;
function tone(f1,f2,d,v=.25,type='sine',t0=0){
  if(mute)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function TT(s){
  if(lang!='en'||!s)return s;
  if(Object.prototype.hasOwnProperty.call(TRD,s))return TRD[s];
  let m;
  if(m=s.match(/^Ambilkan (\d+) ke keranjang$/))return 'Put '+m[1]+' in the basket';
  if(m=s.match(/^Pilih angka (\d+)\.$/))return 'Pick the number '+m[1]+'.';
  if(m=s.match(/^Mana yang (.+)\?$/))return 'Which one is the '+(SHEN[m[1]]||m[1])+'?';
  return s;
}
function translateDOM(){
  document.querySelectorAll('body *').forEach(el=>{
    if(el.children.length)return;
    if(el.dataset.o===undefined){const t=el.textContent.trim();if(!Object.prototype.hasOwnProperty.call(TRD,t))return;el.dataset.o=t}
    el.textContent=lang=='en'?TRD[el.dataset.o]:el.dataset.o;
  });
}

function pz(q){
  const S=200,RR=q.r,CC=q.c,n=RR*CC,W=S/CC,H=S/RR,cv=document.createElement('canvas');

  x.textAlign='center';x.textBaseline='middle';x.fillText(q.e,S,S*1.08);
  const mkp=(r,c,o)=>{const p=document.createElement('canvas');p.width=cv.width/CC;p.height=cv.height/RR;
    p.getContext('2d').drawImage(cv,c*p.width,r*p.height,p.width,p.height,0,0,p.width,p.height);
    p.style.cssText=`width:${W}px;height:${H}px;${o||''}`;return p};
  const bd=document.createElement('div');bd.className='pzb';
  bd.style.cssText=`width:${S+6}px;height:${S+6}px;grid-template-columns:repeat(${CC},1fr);grid-template-rows:repeat(${RR},1fr)`;
  RG(0,n-1).forEach(k=>{const s=document.createElement('div');s.className='sl';s.dataset.s=k;
    if(q.guide)s.appendChild(mkp(k/CC|0,k%CC,'opacity:.22'));bd.appendChild(s)});
  const wrap=document.createElement('div');wrap.className='pzw';
  if(q.thumb){const t=document.createElement('canvas');t.width=t.height=S*2;t.getContext('2d').drawImage(cv,0,0);t.style.cssText='width:64px;height:64px;border:3px solid var(--ink);border-radius:10px;background:#fff';wrap.appendChild(t)}
  wrap.appendChild(bd);$('#stim').innerHTML='';$('#stim').appendChild(wrap);
  $('#opts').className='trz';$('#opts').innerHTML='';
  const pcs=S_(RG(0,n-1)).map(k=>{const p=mkp(k/CC|0,k%CC);p.className='pc';p.dataset.p=k;$('#opts').appendChild(p);return p});
  let done=0,sel=null,drag=null;

    run.m++;sfx.no();p.classList.remove('sel');

  $('#opts').onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>6)drag.mv=1;drag.p.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`};
  $('#opts').onpointerup=e=>{if(!drag)return;const{p,mv}=drag;drag=null;p.style.zIndex='';p.style.transition='transform .35s';
    if(!mv){pcs.forEach(z=>z.classList.remove('sel'));sel=sel==p?null:p;if(sel)p.classList.add('sel');p.style.transform='';return}
    const s=document.elementsFromPoint(e.clientX,e.clientY).find(z=>z.classList&&z.classList.contains('sl')&&!z.querySelector('.pd'));

function cd(q){
  const sz=q.sz,A={U:'⬆️',L:'⬅️',D:'⬇️',R:'➡️'};let pos=q.st.slice(),code=[],busy=false;
  const draw=()=>{let h='<div class="bd" style="grid-template-columns:repeat('+sz+',1fr)">';
    for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){const k=r+','+c;
      h+=`<span class="bc">${pos[0]==r&&pos[1]==c?av():q.goal.join()==k?'🍎':q.rocks.includes(k)?'🪨':''}</span>`}
    $('#stim').innerHTML=h+'</div>'};
  const ui=()=>{$('#opts').innerHTML=`<div class="prow">${RG(0,q.steps-1).map(k=>`<span class="sl bk">${code[k]?A[code[k]]:''}</span>`).join('')}</div>`+
    '<div class="arrows">'+Object.keys(A).map(c=>`<button class="arw" data-c="${c}">${A[c]}</button>`).join('')+'</div><div class="arrows"><button class="arw" data-c="go">▶️</button><button class="arw" data-c="back">↩️</button></div>'};
  q.fill=()=>{code=q.sol.slice();ui()};
  $('#opts').className='';draw();ui();
  $('#opts').onclick=async e=>{
    const b=e.target.closest('.arw');if(!b||locked||busy)return;arm();const c=b.dataset.c;
    if(c=='back'){code.pop();ui();return}
    if(c!='go'){if(code.length<q.steps){code.push(c);tone(500+code.length*70,700+code.length*70,.09,.2,'triangle');ui()}return}
    if(code.length<q.steps){fbk('Isi semua kotak dulu ya');return}
    busy=true;pos=q.st.slice();draw();let ok=true;
    for(const m of code){await new Promise(r=>setTimeout(r,500));if(!run)return;
      const nr=pos[0]+DIR[m][0],nc=pos[1]+DIR[m][1];
      if(nr<0||nc<0||nr>=sz||nc>=sz||q.rocks.includes(nr+','+nc)){ok=false;break}
      pos=[nr,nc];draw();tone(420,620,.08,.2,'triangle')}
    await new Promise(r=>setTimeout(r,400));if(!run)return;busy=false;
    if(ok&&pos.join()==q.goal.join())fin(run.m<=2);
    else{run.m++;sfx.no();fbk('Ayo coba lagi ya! 💪');pos=q.st.slice();draw()}
  };
}

const isDrag=q=>['pz','pat','bond','sh'].includes(q.kind);
const slotFor=el=>[...$('#stim').querySelectorAll('.sl')].find(s=>!s.querySelector('.pd')&&(el.dataset.v!=null?s.dataset.v==el.dataset.v:s.dataset.s==el.dataset.p));
function demo(){
  if(locked||!run||!$('#game').classList.contains('on'))return;
  const q=run.items[run.q],h=$('#hand'),cd=$('#game .card').getBoundingClientRect(),tk=dtok;
  let seq=[];
  if(isDrag(q)){const p=[...$('#opts').querySelectorAll('.pc')].find(z=>slotFor(z));if(p)seq=[p,slotFor(p)]}
  else if(q.kind=='take'){
    const its=[...$('#opts').querySelectorAll('#tr .it')];
    if(its[0])seq=[its[0],$('#bk'),$('#okb')];
    [...$('#opts').querySelectorAll('.it')].slice(0,q.N).forEach(x=>x.classList.add('bl'))}
  else if(q.kind=='cd')seq=q.sol.map(c=>$('#opts .arw[data-c="'+c+'"]')).concat($('#opts .arw[data-c="go"]'));
  else seq=[$('#opts').children[q.k]];
  seq=seq.filter(Boolean);if(!seq.length)return;
  const go=(t,tr)=>{const r=t.getBoundingClientRect();h.style.transition=tr?'left .6s,top .6s':'none';
    h.style.left=(r.left+r.width/2-cd.left-10)+'px';h.style.top=(r.top+r.height/2-cd.top)+'px'};
  h.hidden=false;go(seq[0],0);
  seq.slice(1).forEach((t,i)=>setTimeout(()=>{if(tk==dtok)go(t,1)},700+i*800));
  setTimeout(()=>{if(tk!=dtok)return;h.hidden=true;
    document.querySelectorAll('#opts .it.bl').forEach(x=>x.classList.remove('bl'));
    if(run&&!locked)arm()},700+seq.length*800+900);
}
$('#help').onclick=()=>{
  if(locked||!run)return;arm();const q=run.items[run.q];
  if(q.kind=='take')[...document.querySelectorAll('#opts .it')].slice(0,q.N).forEach(x=>x.classList.add('bl'));
  else if(isDrag(q)){const nx=[...$('#opts').children].find(z=>z.classList.contains('pc')&&slotFor(z)),sl=nx&&slotFor(nx);if(sl)sl.classList.add('bl')}
  else if(q.kind=='cd'){q.fill();return}
  else $('#opts').children[q.k].classList.add('bl');
  demo();
};

  newQ();
}
$('#np').innerHTML=[1,2,3,4,5,6,7,8,9,'x',0,'ok'].map(k=>`<button data-k="${k}">${k=='x'?'⌫':k=='ok'?'✔':k}</button>`).join('');
$('#np').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const v=b.dataset.k;
  if(v=='x')pgI=pgI.slice(0,-1);
  else if(v=='ok'){
    if(pgI&&+pgI==pgA){
      if(pgm=='rest'){store.pt=0;save();$('#pg').hidden=true;locked=false;arm()}
      else{$('#pgq').hidden=$('#pga').hidden=$('#np').hidden=true;pgOK=true;pgTexts();setDraw();$('#setp').hidden=false}
      return}
    sfx.no();newQ();return}
  else if(pgI.length<3)pgI+=v;
  $('#pga').textContent=pgI;
};
$('#pgb').onclick=()=>{$('#pg').hidden=true};
addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#pg').hidden&&pgm=='set')$('#pg').hidden=true});
function tmr(){$('#tmr').textContent=TT('⏰ Pengingat istirahat: ')+(store.tm||15)+' '+TT('menit')}
function tmsDraw(){$('#tms').innerHTML=[15,30,45,60].map(v=>`<button data-v="${v}" class="${v==(store.tm||15)?'on':''}">${v}<small>${TT('menit')}</small></button>`).join('')}
$('#tms').onclick=e=>{const b=e.target.closest('button');if(!b)return;store.tm=+b.dataset.v;save();tmsDraw();tmr()};
$('#pgx').onclick=()=>{$('#pg').hidden=true;if(pgm=='rest')$('#back').click()};
$('#gear').onclick=()=>pg('set');
$('#lgs').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l)};
$('#lang').onclick=()=>setLang(lang=='id'?'en':'id');
function setLang(l){lang=l;store.lang=l;save();document.documentElement.lang=l;translateDOM();$('#lang').textContent='🌐 '+l.toUpperCase();tmr();dash();if(!$('#pg').hidden&&pgm=='set'){pgTexts();setDraw()}}
tmr();
setInterval(()=>{if($('#game').classList.contains('on')&&$('#pg').hidden){store.pt=(store.pt||0)+1000;if(store.pt%10000==0)save()}},1000);
addEventListener('pagehide',save);
const boing=()=>{tone(220,540,.16,.3);tone(540,330,.12,.15,'triangle',.14)};
function end(){
  const sc=Math.round(run.ok/15*100);
  store.res[key()]=sc;store.last={...cur,sc};save();
  $('#stars').innerHTML='<span class="trophy">🏆</span>';
  $('#score').textContent=TT('Skor')+': '+sc;
  $('#rinfo').textContent=`${TT('Benar')} ${run.ok} ${TT('dari 15 soal.')} `+TT(sc==100?'Sempurna!':sc>=60?'Hebat sekali!':'Hebat, kamu sudah berusaha!');
  show('result');setTimeout(boing,350);setTimeout(boing,850);
}
function pick(i,snd){
  ci=(i+CH.length)%CH.length;store.ch=ci;save();
  $('#hero').innerHTML=av();$('#hero').setAttribute('aria-label',CH[ci][0]);
  $('#cname').textContent=CH[ci][0];
  $('#dots').innerHTML=CH.map((_,k)=>`<i class="${k==ci?'on':''}"></i>`).join('');
  document.querySelectorAll('.mascot').forEach(m=>m.innerHTML=av());
  if(snd)sfx.click();
}
$('#cprev').onclick=()=>pick(ci-1);
$('#cnext').onclick=()=>pick(ci+1);
let sx=null;
$('#hero').addEventListener('pointerdown',e=>{sx=e.clientX});
$('#hero').addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>30)pick(ci+(e.clientX<sx?1:-1),true);sx=null});
pick(ci);
setLang(lang);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body>
</html>
